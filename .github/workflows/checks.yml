name: checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mem_ai
          POSTGRES_USER: mem_ai
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mem_ai -d mem_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem_ai
      POSTGRES_USER: mem_ai
      POSTGRES_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify uv.lock consistency and sync locked dependencies
        run: |
          uv lock --check
          uv sync --locked --dev

      - name: Run Ruff lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run mypy type check
        run: uv run mypy src

      - name: Verify empty database upgrade, downgrade, and Alembic drift check
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Run unit, API, historical-upgrade, and recovery integration test suite
        run: uv run pytest

      - name: Run architecture and documentation checks
        run: uv run python tools/check_architecture.py
